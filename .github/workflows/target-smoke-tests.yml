name: Target Smoke Tests

on:
  workflow_dispatch:
    inputs:
      install_deps_args:
        description: "Extra args for nihdl install-deps (example: --pre --latest)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "targets/**"
      - "test-targets/**"
      - "dependencies.toml"
      - ".github/workflows/target-smoke-tests.yml"
  push:
    branches:
      - main
    paths:
      - "targets/**"
      - "test-targets/**"
      - "dependencies.toml"
      - ".github/workflows/target-smoke-tests.yml"

jobs:
  nihdl-target-smoke:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          python nisetup.py --no-venv

      - name: Show nihdl version
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "labview-fpga-hdl-tools version in use:"
          nihdl version

      - name: Discover target folders
        id: discover
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $targets = Get-ChildItem @("targets", "test-targets") -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "nihdlsettings.py") } |
            ForEach-Object { (Resolve-Path -Relative $_.FullName) -replace '^\.[\\/]', '' -replace '\\', '/' } |
            Sort-Object

          if (-not $targets) {
            throw "No targets with nihdlsettings.py were found under targets/ or test-targets/."
          }

          "targets=$($targets -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Discovered targets: $($targets -join ', ')"

      - name: Run install-deps once
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $targets = "${{ steps.discover.outputs.targets }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          $firstTarget = $targets[0]
          $configPath = Join-Path $env:GITHUB_WORKSPACE "tests" "pipeline" "nihdlsettings.py"
          $inputArgs = ""

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $inputArgs = "${{ github.event.inputs.install_deps_args }}"
          }

          $extraArgs = @()
          if ($inputArgs -and $inputArgs.Trim()) {
            $extraArgs = $inputArgs.Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
            Write-Host "Using extra install-deps args: $($extraArgs -join ' ')"
          }

          Write-Host "Running install-deps from $firstTarget"
          Push-Location $firstTarget
          try {
            & nihdl --verbose install-deps --config=$configPath @extraArgs
          }
          finally {
            Pop-Location
          }

      - name: Run per-target ModelSim and Vivado make + test
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $configPath = Join-Path $env:GITHUB_WORKSPACE "tests" "pipeline" "nihdlsettings.py"
          $targets = "${{ steps.discover.outputs.targets }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)

          # The pipeline nihdlsettings.py sets skip_vivado / skip_modelsim, so
          # every nihdl command below runs in validation-only mode: it generates
          # the project and validates the settings and file lists without
          # launching Vivado or ModelSim (neither is installed on the hosted
          # runner). sim-modelsim / compile-vivado are intentionally NOT run here
          # because they require the real FPGA tools.
          $failures = @()

          function Invoke-Nihdl($target, [string[]]$nihdlArgs) {
            $label = "$target> nihdl $($nihdlArgs -join ' ')"
            Write-Host "== $label"
            & nihdl --verbose @nihdlArgs --config=$configPath
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::FAILED ($LASTEXITCODE): $label"
              $script:failures += $label
            }
          }

          function Test-HasModelSim($target) {
            $settings = Join-Path $env:GITHUB_WORKSPACE $target "nihdlsettings.py"
            if (-not (Test-Path $settings)) { return $false }
            return (Select-String -Path $settings -Pattern 'set_modelsim_top_entity' -Quiet)
          }

          foreach ($target in $targets) {
            Write-Host "::group::$target"
            $hasModelSim = Test-HasModelSim $target
            Push-Location $target
            try {
              # LabVIEW FPGA target support files
              Invoke-Nihdl $target @("gen-target")

              # Vivado flow: make the project, then validate it (RTL check)
              Invoke-Nihdl $target @("gen-vivado")
              Invoke-Nihdl $target @("check-vivado")

              # ModelSim flow: make + validate the ModelSim project. Only targets
              # that declare a testbench (set_modelsim_top_entity) have one.
              if ($hasModelSim) {
                Invoke-Nihdl $target @("gen-modelsim", "--overwrite")
              }
              else {
                Write-Host "$target> no set_modelsim_top_entity; skipping ModelSim smoke test"
              }
            }
            finally {
              Pop-Location
              Write-Host "::endgroup::"
            }
          }

          if ($failures.Count -gt 0) {
            Write-Host "`nFAILED commands:"
            $failures | ForEach-Object { Write-Host "  - $_" }
            throw "$($failures.Count) nihdl command(s) failed."
          }
          Write-Host "`nAll target smoke tests passed."

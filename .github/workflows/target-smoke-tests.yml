name: Target Smoke Tests

on:
  workflow_dispatch:
    inputs:
      install_deps_args:
        description: "Extra args for nihdl install-deps (example: --pre --latest)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "targets/**"
      - "dependencies.toml"
      - "requirements.txt"
      - ".github/workflows/target-smoke-tests.yml"
  push:
    branches:
      - main
    paths:
      - "targets/**"
      - "dependencies.toml"
      - "requirements.txt"
      - ".github/workflows/target-smoke-tests.yml"

jobs:
  nihdl-target-smoke:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Discover target folders
        id: discover
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $targets = Get-ChildItem targets -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "nihdlsettings.py") } |
            Sort-Object Name |
            Select-Object -ExpandProperty Name

          if (-not $targets) {
            throw "No targets with nihdlsettings.py were found under targets/."
          }

          "targets=$($targets -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Discovered targets: $($targets -join ', ')"

      - name: Run install-deps once
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $targets = "${{ steps.discover.outputs.targets }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          $firstTarget = $targets[0]
          $configPath = Join-Path $env:GITHUB_WORKSPACE "tests" "pipeline" "nihdlsettings.py"
          $inputArgs = ""

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $inputArgs = "${{ github.event.inputs.install_deps_args }}"
          }

          $extraArgs = @()
          if ($inputArgs -and $inputArgs.Trim()) {
            $extraArgs = $inputArgs.Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
            Write-Host "Using extra install-deps args: $($extraArgs -join ' ')"
          }

          Write-Host "Running install-deps from targets/$firstTarget"
          Push-Location (Join-Path "targets" $firstTarget)
          try {
            & nihdl install-deps --config=$configPath @extraArgs
          }
          finally {
            Pop-Location
          }

      - name: Run per-target gen-target and gen-vivado
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $configPath = Join-Path $env:GITHUB_WORKSPACE "tests" "pipeline" "nihdlsettings.py"
          $targets = "${{ steps.discover.outputs.targets }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)

          foreach ($target in $targets) {
            Write-Host "::group::$target"
            Push-Location (Join-Path "targets" $target)
            try {
              nihdl gen-target --config=$configPath
              nihdl gen-vivado --config=$configPath
            }
            finally {
              Pop-Location
              Write-Host "::endgroup::"
            }
          }
